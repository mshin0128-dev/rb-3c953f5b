<!DOCTYPE html>
<html lang="ja">
<head>
<script>
(function(){
  try {
    var t = localStorage.getItem('ronbun_theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#3b6ea8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="論文本棚">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>論文本棚</title>
<style>
* , *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: hidden; max-width: 100%; }

:root {
  --bg:#f2f5fa; --card:#fff; --text:#1c2a3a; --sub:#5b6b7c; --accent:#3b6ea8; --line:#d8e0ea;
  --danger:#c0564f; --accent-weak: rgba(59,110,168,0.1);
}
:root[data-theme="dark"] {
  --bg:#141a22; --card:#1c2430; --text:#e8eef6; --sub:#9aa8b8; --accent:#7ba3d1; --line:#2c3644;
  --danger:#d98179; --accent-weak: rgba(123,163,209,0.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --bg:#141a22; --card:#1c2430; --text:#e8eef6; --sub:#9aa8b8; --accent:#7ba3d1; --line:#2c3644;
    --danger:#d98179; --accent-weak: rgba(123,163,209,0.14);
  }
}

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  -webkit-text-size-adjust: 100%;
}

input, textarea, select, button, img, canvas, table {
  max-width: 100%; min-width: 0; font-family: inherit; color: inherit;
}
input, textarea, select, button { font-size: 16px; }

#app { display: flex; flex-direction: column; height: 100vh; min-width: 0; }

.topbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px 14px;
  background: var(--card); border-bottom: 1px solid var(--line);
  min-width: 0;
}
.topbar h1 {
  font-size: 18px; margin: 0; flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; min-width: 44px; border: none; background: transparent;
  color: var(--text); border-radius: 10px; flex: 0 0 auto; cursor: pointer; padding: 0;
}
.icon-btn:active { background: var(--accent-weak); }
.icon-btn svg { width: 24px; height: 24px; }

main.view { flex: 1 1 auto; overflow-y: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
main.view[hidden] { display: none; }

.bottomnav {
  flex: 0 0 auto; display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding: 6px 4px calc(env(safe-area-inset-bottom) + 6px) 4px;
}
.navbtn {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; border: none; background: transparent; color: var(--sub); cursor: pointer;
  min-height: 52px; border-radius: 10px; padding: 4px 2px;
}
.navbtn svg { width: 26px; height: 26px; }
.navbtn span { font-size: 11px; }
.navbtn.active { color: var(--accent); }

.pad { padding: 14px; min-width: 0; }
.section-title { font-size: 20px; font-weight: 700; margin: 4px 0 12px 0; }

.searchrow { display: flex; gap: 8px; margin-bottom: 12px; min-width: 0; }
.searchrow input[type="search"] {
  flex: 1 1 auto; min-width: 0; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; background: var(--bg); color: var(--text);
}

.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); padding: 8px 14px; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.block { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.5; }

.chiprow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.chip {
  flex: 0 0 auto; padding: 8px 14px; min-height: 36px; display:flex; align-items:center;
  border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  color: var(--sub); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; min-width: 0;
}
@media (max-width: 340px) {
  .grid { grid-template-columns: 1fr; }
}
.card {
  background: var(--card); border-radius: 14px; box-shadow: 0 10px 28px rgba(28, 55, 90, 0.08);
  padding: 10px; min-width: 0; position: relative; display: flex; flex-direction: column;
}
.card .thumb {
  width: 100%; aspect-ratio: 3/4; border-radius: 8px; background: var(--bg);
  border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; justify-content: center;
  margin-bottom: 8px;
}
.card .thumb img, .card .thumb canvas { width: 100%; height: 100%; object-fit: cover; display:block; }
.card .thumb svg { width: 40%; height: 40%; color: var(--sub); }
.card .title {
  font-size: 13px; font-weight: 600; line-height: 1.3; margin: 0 0 4px 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-width: 0; word-break: break-word;
}
.card .meta { font-size: 11px; color: var(--sub); margin: 0; }
.card .cardmenu {
  position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: none;
  background: rgba(255,255,255,0.001); border-radius: 8px; color: var(--sub); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.card .cardmenu svg { width: 18px; height: 18px; }

.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--sub); padding: 60px 24px; gap: 14px;
}
.empty svg { width: 72px; height: 72px; }

.progresschip {
  font-size: 12px; color: var(--sub); margin-bottom: 10px;
}

/* 閲覧 */
.reader-topbar { align-items: flex-start; }
.reader-title-wrap { flex: 1 1 auto; min-width: 0; }
.reader-title-wrap h1 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pagebar {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 8px 14px; background: var(--card); border-bottom: 1px solid var(--line);
}
.pagebar span { font-size: 13px; color: var(--sub); min-width: 60px; text-align: center; }
.modebar { display: flex; gap: 6px; padding: 8px 14px 0 14px; background: var(--card); }
.modebar button {
  flex: 1 1 0; border: 1px solid var(--line); background: var(--bg); color: var(--sub);
  border-radius: 8px; padding: 8px 4px; font-size: 12px; min-height: 36px; cursor: pointer;
}
.modebar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

#view-reader:not([hidden]) {
  display: flex; flex-direction: column; overflow: hidden;
}
#reader-main-wrap, #reader-empty-wrap {
  display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
}
#reader-main-wrap[hidden], #reader-empty-wrap[hidden] { display: none; }
.reader-body { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; }
.pane {
  flex: 1 1 50%; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 10px; border-right: 1px solid var(--line);
}
.pane:last-child { border-right: none; }
.reader-body.mode-source .pane.trans { display: none; }
.reader-body.mode-source .pane.source { flex: 1 1 100%; }
.reader-body.mode-trans .pane.source { display: none; }
.reader-body.mode-trans .pane.trans { flex: 1 1 100%; }
.pdfcanvas-wrap { display: flex; justify-content: center; }
.pdfcanvas-wrap canvas { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; }
.trans-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.sourcetext-toggle { font-size: 12px; color: var(--accent); margin-top: 14px; cursor: pointer; }
.hint {
  font-size: 12px; color: var(--sub); background: var(--accent-weak); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 10px;
}
.reader-empty { height: 100%; }

/* 設定 */
.settings-card {
  background: var(--card); border-radius: 14px; box-shadow: 0 10px 28px rgba(28, 55, 90, 0.08);
  padding: 14px; margin-bottom: 14px; min-width: 0;
}
.settings-card h2 { font-size: 15px; margin: 0 0 10px 0; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; min-width: 0; flex-wrap: wrap; }
.settings-row label { font-size: 14px; flex: 1 1 auto; min-width: 0; }
.segrow { display: flex; gap: 6px; }
.segrow button {
  border: 1px solid var(--line); background: var(--bg); color: var(--sub); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; min-height: 36px; cursor: pointer;
}
.segrow button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.settings-card input[type="password"], .settings-card input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--bg); color: var(--text); margin-bottom: 10px;
}
.statustag { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-weak); color: var(--accent); }
.statustag.off { background: var(--line); color: var(--sub); }
.small { font-size: 12px; color: var(--sub); line-height: 1.6; }
.footer-ver { text-align: center; color: var(--sub); font-size: 12px; padding: 10px 0 30px 0; }

/* modal & toast */
.overlay {
  position: fixed; inset: 0; background: rgba(10, 16, 24, 0.45); display: flex;
  align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.overlay[hidden] { display: none; }
.modal {
  background: var(--card); border-radius: 16px; padding: 18px; width: 100%; max-width: 340px;
  box-shadow: 0 10px 28px rgba(28, 55, 90, 0.2); min-width: 0;
}
.modal h3 { margin: 0 0 12px 0; font-size: 16px; }
.modal p { font-size: 13px; color: var(--sub); margin: 0 0 12px 0; }
.modal input[type="text"] {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--bg); color: var(--text); margin-bottom: 14px;
}
.modal .modalbtns { display: flex; gap: 8px; justify-content: flex-end; }
.modal .folderlist { max-height: 240px; overflow-y: auto; margin-bottom: 10px; }
.modal .folderlist button {
  display: flex; width: 100%; text-align: left; padding: 10px 8px; border: none; background: transparent;
  color: var(--text); font-size: 14px; border-radius: 8px; cursor: pointer; min-height: 44px; align-items: center;
}
.modal .folderlist button.active { background: var(--accent-weak); color: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 76px); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-size: 13px; z-index: 60; max-width: 86%; text-align: center; opacity: 0; transition: opacity .25s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.menupop {
  position: fixed; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 10px 28px rgba(28, 55, 90, 0.18); z-index: 55; min-width: 160px; overflow: hidden;
}
.menupop[hidden] { display: none; }
.menupop button {
  display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; padding: 12px 14px;
  border: none; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; min-height: 44px;
}
.menupop button.danger { color: var(--danger); }
.menupop button svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="app">

  <!-- 本棚 -->
  <main class="view" id="view-shelf">
    <div class="topbar">
      <h1>本棚</h1>
    </div>
    <div class="pad">
      <div class="searchrow">
        <input type="search" id="shelf-search" placeholder="タイトル・ファイル名で検索">
      </div>
      <div class="btnrow">
        <label class="btn primary" for="file-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6-6 6 6M5 20h14"/></svg>
          PDFを追加
        </label>
        <input type="file" id="file-input" accept="application/pdf" multiple hidden>
        <button class="btn" id="btn-new-folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 12v4M10 14h4"/></svg>
          フォルダを作成
        </button>
      </div>
      <div class="progresschip" id="import-progress" hidden></div>
      <div class="chiprow" id="folder-chips"></div>
      <div id="shelf-grid"></div>
    </div>
  </main>

  <!-- 閲覧 -->
  <main class="view" id="view-reader" hidden>
    <div id="reader-empty-wrap">
      <div class="topbar"><h1>閲覧</h1></div>
      <div class="empty reader-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 C 10 4.5 6.5 4 4 4.6 L4 18 C 6.5 17.4 10 17.9 12 19.4 C 14 17.9 17.5 17.4 20 18 L20 4.6 C 17.5 4 14 4.5 12 6 Z"/><path d="M12 6 L12 19.4"/></svg>
        <p>本棚から論文を選んでください</p>
      </div>
    </div>
    <div id="reader-main-wrap" hidden>
      <div class="topbar reader-topbar">
        <button class="icon-btn" id="btn-reader-back" aria-label="戻る">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="reader-title-wrap"><h1 id="reader-title">&nbsp;</h1></div>
      </div>
      <div class="pagebar">
        <button class="icon-btn" id="btn-page-prev" aria-label="前のページ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="page-indicator">1 / 1</span>
        <button class="icon-btn" id="btn-page-next" aria-label="次のページ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="modebar">
        <button data-mode="both" class="active">両方</button>
        <button data-mode="source">原文</button>
        <button data-mode="trans">訳</button>
      </div>
      <div class="reader-body mode-both" id="reader-body">
        <div class="pane source">
          <div class="pdfcanvas-wrap"><canvas id="pdf-canvas"></canvas></div>
        </div>
        <div class="pane trans" id="pane-trans">
          <!-- 翻訳JSが内容を差し込む -->
        </div>
      </div>
    </div>
  </main>

  <!-- 設定 -->
  <main class="view" id="view-settings" hidden>
    <div class="topbar"><h1>設定</h1></div>
    <div class="pad">

      <div class="settings-card">
        <h2>本棚表示</h2>
        <div class="settings-row">
          <label>テーマ</label>
          <div class="segrow" id="theme-segrow">
            <button data-theme="auto">自動</button>
            <button data-theme="light">ライト</button>
            <button data-theme="dark">ダーク</button>
          </div>
        </div>
      </div>

      <div class="settings-card">
        <h2>翻訳</h2>
        <div class="settings-row">
          <label>Gemini APIキー</label>
          <span class="statustag off" id="key-status">未設定</span>
        </div>
        <input type="password" id="gemini-key-input" placeholder="APIキーを入力" autocomplete="off">
        <div class="btnrow">
          <button class="btn primary" id="btn-save-key">保存</button>
          <button class="btn danger" id="btn-delete-key">キー削除</button>
        </div>
        <p class="small">
          キーはブラウザ内（localStorage）だけに保存され、サーバーには送信されません。翻訳リクエストはGoogleのGemini APIへ直接送信されます。<br>
          推奨モデル: gemini-2.0-flash（失敗時は gemini-2.5-flash や gemini-flash-latest に自動フォールバック）
        </p>
      </div>

      <div class="settings-card">
        <h2>データ</h2>
        <p class="small" id="data-counts">論文 0件 / フォルダ 0件</p>
        <div class="btnrow">
          <button class="btn" id="btn-clear-cache">翻訳キャッシュ削除</button>
          <button class="btn danger" id="btn-clear-all">全データ消去</button>
        </div>
      </div>

      <div class="footer-ver">論文本棚 v2026.11.06a</div>
    </div>
  </main>

  <nav class="bottomnav">
    <button class="navbtn active" data-view="shelf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5l4-1 1 16-4 1z"/></svg>
      <span>本棚</span>
    </button>
    <button class="navbtn" data-view="reader">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 C 10 4.5 6.5 4 4 4.6 L4 18 C 6.5 17.4 10 17.9 12 19.4 C 14 17.9 17.5 17.4 20 18 L20 4.6 C 17.5 4 14 4.5 12 6 Z"/><path d="M12 6 L12 19.4"/></svg>
      <span>閲覧</span>
    </button>
    <button class="navbtn" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1z"/></svg>
      <span>設定</span>
    </button>
  </nav>
</div>

<!-- フォルダ作成/リネームモーダル -->
<div class="overlay" id="modal-folder" hidden>
  <div class="modal">
    <h3 id="modal-folder-title">フォルダを作成</h3>
    <input type="text" id="modal-folder-input" placeholder="フォルダ名">
    <div class="modalbtns">
      <button class="btn" data-close="modal-folder">キャンセル</button>
      <button class="btn primary" id="modal-folder-save">保存</button>
    </div>
  </div>
</div>

<!-- フォルダ管理（リネーム・削除の選択）モーダル -->
<div class="overlay" id="modal-folder-manage" hidden>
  <div class="modal">
    <h3>フォルダを編集</h3>
    <input type="text" id="modal-folder-manage-input" placeholder="フォルダ名">
    <div class="modalbtns" style="justify-content: space-between;">
      <button class="btn danger" id="modal-folder-delete">削除</button>
      <div class="modalbtns">
        <button class="btn" data-close="modal-folder-manage">キャンセル</button>
        <button class="btn primary" id="modal-folder-rename-save">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- タイトル編集モーダル -->
<div class="overlay" id="modal-rename" hidden>
  <div class="modal">
    <h3>タイトルを編集</h3>
    <input type="text" id="modal-rename-input" placeholder="タイトル">
    <div class="modalbtns">
      <button class="btn" data-close="modal-rename">キャンセル</button>
      <button class="btn primary" id="modal-rename-save">保存</button>
    </div>
  </div>
</div>

<!-- フォルダへ移動モーダル -->
<div class="overlay" id="modal-move" hidden>
  <div class="modal">
    <h3>フォルダへ移動</h3>
    <div class="folderlist" id="modal-move-list"></div>
    <div class="modalbtns">
      <button class="btn" data-close="modal-move">キャンセル</button>
    </div>
  </div>
</div>

<!-- 確認モーダル（汎用） -->
<div class="overlay" id="modal-confirm" hidden>
  <div class="modal">
    <h3 id="modal-confirm-title">確認</h3>
    <p id="modal-confirm-body"></p>
    <div class="modalbtns">
      <button class="btn" data-close="modal-confirm">キャンセル</button>
      <button class="btn danger" id="modal-confirm-ok">実行</button>
    </div>
  </div>
</div>

<div class="menupop" id="card-menu" hidden>
  <button id="menu-rename">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2 2 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    タイトル編集
  </button>
  <button id="menu-move">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
    フォルダへ移動
  </button>
  <button id="menu-delete" class="danger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    削除
  </button>
</div>

<div class="toast" id="toast"></div>
